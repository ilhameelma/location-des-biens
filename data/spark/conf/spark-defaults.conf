# Étape 11-12 — Charge automatiquement les JAR de data/spark/jars/ sur le
# classpath de Spark (driver + executors), pour ne plus jamais avoir besoin
# de passer --packages ou --jars à spark-submit.
#
# La syntaxe "/chemin/*" (astérisque final) est une fonctionnalité native de
# la JVM (java -cp) : elle inclut tous les .jar du dossier, sans passer par
# un shell (donc ça fonctionne même avec `docker exec`, qui n'invoque pas de
# shell par défaut et n'étend donc pas les wildcards lui-même).

spark.driver.extraClassPath   /opt/spark/jars/extras/*
spark.executor.extraClassPath /opt/spark/jars/extras/*
