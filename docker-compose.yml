# ============================================================
# SmartRent Platform — docker-compose.yml
# VERSION COMPLÈTE (Phase 5, étape 20) : plus AUCUN service ne tourne hors
# Docker. backend / ml_service / frontend / nginx (reverse-proxy) ont été
# ajoutés à la stack déjà existante (postgres, minio, kafka, airflow,
# elasticsearch, spark).
#
# Avant de lancer :
#   1. cp .env.example .env         puis adapte DOMAIN / PUBLIC_API_URL
#   2. cp backend/.env.docker.example backend/.env
#   3. cp ml_service/.env.docker.example ml_service/.env
#      (adapte les mots de passe/secrets dans ces 3 fichiers)
#
# Démarrage : docker compose up -d --build
# Arrêt     : docker compose down
# Arrêt + suppression des volumes (⚠️ perte des données) : docker compose down -v
# ============================================================

services:

  # ------------------------------------------------------------
  # Base de données transactionnelle de l'application
  # ------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: smartrent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrent_db
      POSTGRES_USER: smartrent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartrent_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/smartrent_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./postgres/warehouse_schema.sql:/docker-entrypoint-initdb.d/02_warehouse_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrent -d smartrent_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Stockage objet (photos de biens, documents contractuels,
  # et data lake — étape 12)
  # ------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: smartrent_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: smartrent_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartrent_minio_pwd}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    ports:
      - "9000:9000"   # API compatible S3 (aussi proxifié via Nginx /smartrent-photos/)
      - "9001:9001"   # Console web (http://<IP_VM>:9001) — à fermer publiquement en prod (NSG/ufw)
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Crée automatiquement le bucket du data lake au démarrage (étape 12)
  # ------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: smartrent_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 smartrent_admin ${MINIO_ROOT_PASSWORD:-smartrent_minio_pwd} &&
        mc mb --ignore-existing local/smartrent-datalake &&
        echo "Bucket 'smartrent-datalake' prêt."
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Coordination pour Kafka
  # ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: smartrent_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Broker de messages (étape 10)
  # ------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smartrent_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Interface web pour visualiser les topics Kafka
  # ------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartrent_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartrent
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Étape 18 — Recherche avancée (Elasticsearch)
  # ------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: smartrent_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Spark — étape 11 (ETL/traitement)
  # ------------------------------------------------------------
  spark:
    image: apache/spark:3.4.1
    container_name: smartrent_spark
    restart: unless-stopped
    depends_on:
      - kafka
      - minio
    user: root
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      PATH: /opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./data/spark/jobs:/opt/spark-jobs
      - ./data/spark/checkpoints:/opt/spark-jobs/_checkpoints
      - ./data/spark/jars:/opt/spark/jars/extras
      - ./data/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Base de métadonnées Airflow
  # ------------------------------------------------------------
  postgres_airflow:
    image: postgres:16
    container_name: smartrent_postgres_airflow
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_pwd
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Initialisation Airflow
  # ------------------------------------------------------------
  airflow-init:
    build: ./airflow
    container_name: smartrent_airflow_init
    depends_on:
      postgres_airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pwd@postgres_airflow/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "smartrent_pfe_secret_key_change_if_needed"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname SmartRent \
          --role Admin \
          --email admin@smartrent.local
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Interface web Airflow (http://<IP_VM>:8081)
  # ------------------------------------------------------------
  airflow-webserver:
    build: ./airflow
    container_name: smartrent_airflow_webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pwd@postgres_airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "smartrent_pfe_secret_key_change_if_needed"
    ports:
      - "8081:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Ordonnanceur Airflow
  # ------------------------------------------------------------
  airflow-scheduler:
    build: ./airflow
    container_name: smartrent_airflow_scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pwd@postgres_airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "smartrent_pfe_secret_key_change_if_needed"
    command: scheduler
    user: "0:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - smartrent_net

  # ============================================================
  # NOUVEAU (Phase 5, étape 20) — plus rien hors Docker
  # ============================================================

  # ------------------------------------------------------------
  # Back-end FastAPI (Phase 2 + IA/carto/recherche) — dockerisé
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrent_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - smartrent_net
    # Pas de "ports:" exposé à l'hôte : uniquement joignable via le
    # reverse-proxy nginx (/api/) — cohérent avec la checklist sécurité
    # existante (README_DEPLOIEMENT_AZURE.md, §11)

  # ------------------------------------------------------------
  # Micro-service IA (étape 16) — dockerisé
  # NOTE : le dossier local peut s'appeler "ml" ou "ml_service" chez toi
  # (adapte "context:" ci-dessous en conséquence) — le NOM DU SERVICE
  # Docker, lui, doit rester "ml_service" car c'est ce nom que le backend
  # utilise pour le joindre (ML_SERVICE_URL=http://ml_service:8001).
  # ------------------------------------------------------------
  ml_service:
    build:
      context: ./ml_service      # <- renomme en "./ml" si ton dossier s'appelle ainsi
      dockerfile: Dockerfile
    container_name: smartrent_ml_service
    restart: unless-stopped
    env_file:
      - ./ml_service/.env
    depends_on:
      - backend
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Front-end React (Vite build servi par Nginx) — dockerisé
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
    container_name: smartrent_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - smartrent_net

  # ------------------------------------------------------------
  # Reverse proxy — point d'entrée UNIQUE de la plateforme (80/443)
  # ------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: smartrent_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - minio
    networks:
      - smartrent_net

networks:
  smartrent_net:
    driver: bridge

volumes:
  postgres_data:
  postgres_airflow_data:
  minio_data:
  kafka_data:
  elasticsearch_data:
