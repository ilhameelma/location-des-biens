# Nginx interne au conteneur frontend : sert uniquement les fichiers
# statiques buildés par Vite. Le routage /api/, /smartrent-photos/, etc.
# est géré par le reverse-proxy Nginx RACINE du projet (voir
# nginx/nginx.conf à la racine), pas ici.
server {
    listen 80;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    absolute_redirect off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
