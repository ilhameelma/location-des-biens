# ============================================================
# SmartRent — Reverse proxy Nginx racine (conteneur "nginx" du
# docker-compose.yml) — point d'entrée UNIQUE de toute la plateforme
# (port 80/443). Route vers les autres conteneurs par leur nom de
# service Docker (réseau interne smartrent_net) :
#   /              -> frontend (SPA React buildée)
#   /api/          -> backend (FastAPI) — inclut aussi le WebSocket
#                     (/api/conversations/ws/..., /api/notifications/ws)
#   /docs, /redoc, /openapi.json -> backend (Swagger/ReDoc, hors préfixe /api)
#   /smartrent-photos/ -> minio (photos publiques des annonces)
# ============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # --- Certbot (validation HTTP-01 pour Let's Encrypt) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API back-end (REST + WebSocket) ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # Nécessaire pour que /api/conversations/ws/... et
        # /api/notifications/ws (WebSocket) fonctionnent à travers ce proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les WebSocket restent ouverts longtemps — timeout large plutôt
        # que la valeur par défaut (60s) qui couperait les conversations
        # inactives ou les notifications en attente
        proxy_read_timeout 3600s;
    }

    # --- Documentation API (Swagger/ReDoc) ---
    # FastAPI expose /docs, /redoc et /openapi.json À LA RACINE de
    # l'application, PAS sous /api/ (seuls les routeurs métier ont le
    # préfixe "/api", voir app/main.py) — d'où ces 3 emplacements séparés,
    # sans quoi ils tomberaient dans le catch-all "/" (frontend) et
    # afficheraient l'app React à la place de la doc.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # --- Photos de biens (MinIO), lecture publique ---
    # Le nom du bucket ("smartrent-photos") fait partie du chemin d'URL
    # généré par le backend (voir app/storage.py:build_public_url) — on le
    # fait donc pointer directement vers MinIO sans réécriture de chemin.
    location /smartrent-photos/ {
        proxy_pass http://minio:9000/smartrent-photos/;
        proxy_set_header Host $host;
    }

    # --- Front-end (React/Vite, servi par le conteneur frontend) ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# Une fois un nom de domaine pointé vers l'IP de la VM et un certificat
# Let's Encrypt obtenu (voir README_DOCKER.md, section HTTPS), ajouter un
# second bloc server{} sur le port 443 avec ssl_certificate /
# ssl_certificate_key, et rediriger ce bloc port 80 vers le port 443
# (sauf /.well-known/acme-challenge/, à garder en clair pour le
# renouvellement automatique du certificat).
# ============================================================
